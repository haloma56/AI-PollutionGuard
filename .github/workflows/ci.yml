
name: AI-PollutionGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q ai app tests

      - name: Validate dataset
        run: |
          python -c "from ai.preprocessing import load_and_clean_data; X, y = load_and_clean_data(); print(len(X)); assert len(X) >= 5"

      - name: Train AI model
        run: python -m ai.train_model

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: pollutionguard-trained-model
          path: ai/pollution_model.pkl

      - name: Build Docker image
        run: docker build -t ai-pollutionguard:ci .
